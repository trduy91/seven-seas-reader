name: Validate Seven Seas Reader

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/validate_catalog.py"
      - ".github/workflows/validate-reader.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/validate_catalog.py"
      - ".github/workflows/validate-reader.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog and linked assets
        run: python scripts/validate_catalog.py
