---
layout: default
---
<article class="chapter">
  <header>
    <p><a href="{{ '/' | relative_url }}">Seven Seas Reader</a> / {{ page.book }}</p>
    <h1>{{ page.title }}</h1>
    <p>Chapter {{ page.chapter_number }} · Revision {{ page.revision }}</p>
  </header>
  <section class="chapter-content">
    {{ content }}
  </section>
  <footer>
    <p><a href="{{ '/' | relative_url }}">Back to reading list</a></p>
  </footer>
</article>
